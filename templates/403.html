{% extends "base.html" %}

{% block title %}Not allowed{% endblock %}

{% block content %}
<section class="collection-section">
    <div class="container text-center">
        <p class="error-code mb-2" aria-hidden="true">403</p>
        <h1>You can't do that</h1>
        <p class="section-intro mx-auto mb-4">You can only edit or delete rings that you added.</p>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a class="btn btn-ink" href="{% url 'ring_list' %}">Browse rings</a>
            {% if user.is_authenticated %}
            <a class="btn btn-outline-ink" href="{% url 'my_rings' %}">My rings</a>
            {% endif %}
        </div>
    </div>
</section>
{% endblock %}

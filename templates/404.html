{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<section class="collection-section">
    <div class="container text-center">
        <p class="error-code mb-2" aria-hidden="true">404</p>
        <h1>We can't find that page</h1>
        <p class="section-intro mx-auto mb-4">The link may be broken, or the ring may have been deleted.</p>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a class="btn btn-ink" href="{% url 'home' %}">Go to the home page</a>
            <a class="btn btn-outline-ink" href="{% url 'ring_list' %}">Browse rings</a>
        </div>
    </div>
</section>
{% endblock %}

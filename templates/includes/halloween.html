{% comment %}
    Halloween decorations for the hero on the home page: bats,
    a spider, a web and two pumpkins. They only show from 24 October to
    1 November. They're decoration only, so screen readers skip them.
{% endcomment %}
{% if show_halloween_effect %}
<div class="halloween" aria-hidden="true">
    <svg class="halloween-shapes" width="0" height="0">
        <symbol id="halloween-bat" viewBox="0 0 64 32">
            <path d="M32 10 29.5 6.5 29 11C25 9 18 6 12 7 8 7.5 4 9 1 12 5 12 7 14 8 17 10 15 13 15 15 18 17 16 21 16 23 19 25 17 28 18 29 21L32 26 35 21C36 18 39 17 41 19 43 16 47 16 49 18 51 15 54 15 56 17 57 14 59 12 63 12 60 9 56 7.5 52 7 46 6 39 9 35 11L34.5 6.5Z"/>
        </symbol>
    </svg>

    <span class="halloween-star star-1"></span>
    <span class="halloween-star star-2"></span>
    <span class="halloween-star star-3"></span>
    <span class="halloween-star star-4"></span>

    <span class="halloween-bat bat-1"><svg><use href="#halloween-bat"/></svg></span>
    <span class="halloween-bat bat-2"><svg><use href="#halloween-bat"/></svg></span>
    <span class="halloween-bat bat-3"><svg><use href="#halloween-bat"/></svg></span>
    <span class="halloween-bat bat-4"><svg><use href="#halloween-bat"/></svg></span>
    <span class="halloween-bat bat-5"><svg><use href="#halloween-bat"/></svg></span>

    <span class="halloween-spider">
        <svg viewBox="0 0 32 32">
            <path d="M16 12 9 6M16 12 23 6M16 15 6 13M16 15 26 13M16 17 6 21M16 17 26 21M16 19 9 27M16 19 23 27"/>
            <circle cx="16" cy="16" r="5"/>
            <circle cx="16" cy="10" r="3"/>
        </svg>
    </span>

    <svg class="halloween-web" viewBox="0 0 120 120">
        <path d="M120 120 0 120M120 120 8 70M120 120 40 28M120 120 84 0M120 120 120 0M96 120C94 112 95 106 98 100 102 96 108 95 114 96 117 97 119 98 120 99M72 120C69 107 70 95 76 84 84 76 96 72 110 73 114 73 117 74 120 75M48 120C45 102 47 85 56 70 68 57 86 51 104 50 110 50 115 51 120 52M24 120C21 97 24 74 37 56 53 39 76 30 99 28 107 28 114 29 120 30"/>
    </svg>
</div>
{% endif %}

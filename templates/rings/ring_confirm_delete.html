{% extends "base.html" %}

{% block title %}Delete {{ ring.name }}{% endblock %}

{% block content %}
<section class="collection-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="form-card">
                    <h1 class="h2">Delete {{ ring.name }}?</h1>
                    <p>This removes the ring for good. You can't undo it.</p>
                    <form method="post" class="d-flex flex-wrap gap-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Delete ring</button>
                        <a class="btn btn-outline-ink" href="{{ ring.get_absolute_url }}">Keep it</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
